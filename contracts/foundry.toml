# Foundry configuration for the RLAY token project
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Named RPC endpoints — override BASE_SEPOLIA_RPC_URL in your environment (.env)
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan-compatible verification for Base Sepolia (BaseScan)
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
